name: Diagnose Scholar access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install curl_cffi==0.16.3
      - name: Inspect the reachable Scholar response
        run: |
          python -u - <<'PYTHON'
          import re
          import sys
          import time
          import curl_cffi
          from scripts.fetch_citations import PROFILE_URL, CitationTableParser, parse_total_citations
          for attempt in range(2):
              try:
                  response = curl_cffi.get(PROFILE_URL, impersonate="chrome", proxy="http://45.26.30.144:8888", timeout=30)
                  print("HTTP", response.status_code, "URL", response.url)
                  visible = re.sub(r"<(script|style)\b[^>]*>.*?</\1>", "", response.text, flags=re.S | re.I)
                  visible = " ".join(re.sub(r"<[^>]+>", " ", visible).split())
                  print("Page text:", visible[:3000], "END:", visible[-1000:])
                  parser = CitationTableParser()
                  parser.feed(response.text)
                  print("Summary table rows:", parser.rows)
                  print("Total citations:", parse_total_citations(response.text))
                  sys.exit(0)
              except Exception as error:
                  print("Attempt", attempt + 1, type(error).__name__, str(error))
              if attempt == 0:
                  time.sleep(5)
          sys.exit(1)
          PYTHON
