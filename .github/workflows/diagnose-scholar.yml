name: Diagnose Scholar access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Inspect Google-owned website reader
        run: |
          python -u - <<'PY'
          from playwright.sync_api import sync_playwright
          from scripts.fetch_citations import CitationTableParser, parse_total_citations
          url = "https://scholar-google-com.translate.goog/citations?user=y0LVrtgAAAAJ&hl=en&_x_tr_sl=auto&_x_tr_tl=en&_x_tr_hl=en"
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch()
              page = browser.new_page(locale="en-US")
              response = page.goto(url, wait_until="domcontentloaded", timeout=60000)
              print("HTTP", response.status, "URL", page.url)
              try:
                  page.locator("#gsc_rsb_st").wait_for(timeout=15000)
              except Exception:
                  pass
              print("Page text:", page.locator("body").inner_text()[:2500])
              print("Frames:", [frame.url for frame in page.frames])
              parser = CitationTableParser()
              parser.feed(page.content())
              print("Rows:", parser.rows)
              print("Total citations:", parse_total_citations(page.content()))
              browser.close()
          PY
