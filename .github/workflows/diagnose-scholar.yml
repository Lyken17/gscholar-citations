name: Diagnose Scholar access

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted runner to test
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - macos-latest

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install browser clients
        run: |
          python -m pip install curl_cffi==0.16.3 playwright
          python -m playwright install --with-deps chromium
      - name: Test browser access
        run: |
          python -u - <<'PY'
          import sys
          import curl_cffi
          from playwright.sync_api import sync_playwright
          from scripts.fetch_citations import PROFILE_URL, parse_total_citations

          try:
              response = curl_cffi.get(PROFILE_URL, impersonate="chrome", timeout=30)
              print("curl_cffi HTTP", response.status_code)
              if response.status_code == 200:
                  print("Total citations:", parse_total_citations(response.text))
                  sys.exit(0)
          except Exception as error:
              print("curl_cffi:", type(error).__name__, str(error))

          try:
              with sync_playwright() as playwright:
                  browser = playwright.chromium.launch()
                  page = browser.new_page(locale="en-US")
                  response = page.goto(PROFILE_URL, wait_until="domcontentloaded", timeout=45000)
                  print("Chromium HTTP", response.status)
                  print("Page title:", page.title())
                  total = parse_total_citations(page.content())
                  print("Total citations:", total)
                  browser.close()
                  sys.exit(0)
          except Exception as error:
              print("Chromium:", type(error).__name__, str(error))

          import ipaddress
          import json
          import random
          from urllib.parse import urlsplit
          from urllib.request import urlopen
          from concurrent.futures import ThreadPoolExecutor

          list_url = "https://cdn.jsdelivr.net/gh/proxifly/free-proxy-list@main/proxies/countries/US/data.json"
          with urlopen(list_url, timeout=30) as response:
              entries = json.load(response)
          proxies = []
          for entry in entries:
              try:
                  proxy = urlsplit(entry["proxy"])
                  if proxy.scheme == "http" and ipaddress.ip_address(proxy.hostname).is_global and 1 <= proxy.port <= 65535:
                      proxies.append(entry["proxy"])
              except (KeyError, TypeError, ValueError):
                  continue
          candidates = ["http://45.26.30.144:8888"]

          def check(proxy):
              try:
                  response = curl_cffi.get(PROFILE_URL, impersonate="chrome", proxy=proxy, timeout=10)
                  print(proxy, "HTTP", response.status_code)
                  if response.status_code == 200:
                      import re
                      print("Final URL:", response.url)
                      print("Page title:", re.findall(r"<title>(.*?)</title>", response.text, re.S))
                      visible = re.sub(r"<(script|style)\b[^>]*>.*?</\1>", "", response.text, flags=re.S | re.I)
                      visible = re.sub(r"<[^>]+>", " ", visible)
                      print("Page text:", " ".join(visible.split())[-4000:])
                      from scripts.fetch_citations import CitationTableParser
                      parser = CitationTableParser()
                      parser.feed(response.text)
                      print("Summary table rows:", parser.rows)
                      return parse_total_citations(response.text)
              except Exception as error:
                  print(proxy, type(error).__name__, str(error)[:160])
              return None

          with ThreadPoolExecutor(max_workers=3) as executor:
              counts = list(executor.map(check, candidates))
          valid = [count for count in counts if count is not None]
          if valid:
              print("Total citations:", valid[0])
              sys.exit(0)
          sys.exit("No tested route returned a valid Scholar citation count.")
          PY
